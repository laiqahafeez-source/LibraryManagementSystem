
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library Management System</title>
     <link rel="stylesheet" href="windows.css">
</head>
<body>

    <header>
        <h1>Smart Library Management System</h1>
        <p>Welcome, Librarian!</p>
    </header>

    <nav>
        <button onclick="showPage('dashboard')">Dashboard</button>
        <button onclick="showPage('books')">Search Books</button>
        <button onclick="showPage('issue')">Issue Book</button>
        <button onclick="showPage('return')">Return Book</button>
    </nav>

    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            <p>Total Books: <span id="totalBooks">3</span></p>
            <p>Available Books: <span id="availableBooks">2</span></p>
            <p>Issued Books: <span id="issuedBooks">1</span></p>
        </section>

        <section id="books" hidden>
            <h2>Search Books</h2>
            <input type="text" id="search" placeholder="Enter book name">
            <button onclick="searchBook()">Search</button>
            <div id="bookResults"></div>
        </section>

        <section id="issue" hidden>
            <h2>Issue Book</h2>
            <form id="issueForm">
                <label>Student ID:</label>
                <input type="number" id="studentId" required>
                <br><br>

                <label>Book ID:</label>
                <input type="number" id="issueBookId" required>
                <br><br>

                <button type="submit">Issue Book</button>
            </form>
            <p id="issueMessage"></p>
        </section>

        <section id="return" hidden>
            <h2>Return Book</h2>
            <form id="returnForm">
                <label>Book ID:</label>
                <input type="number" id="returnBookId" required>
                <br><br>

                <button type="submit">Return Book</button>
            </form>
            <p id="returnMessage"></p>
        </section>
    </main>

    <footer>
        <p>Smart Library Management System | DSA Project</p>
    </footer>

    <script>
        function showPage(pageId) {
            const pages = document.querySelectorAll("main section");

            pages.forEach(function(page) {
                page.hidden = true;
            });

            document.getElementById(pageId).hidden = false;
        }
    </script>

</body>
</html>
